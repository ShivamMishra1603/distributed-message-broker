broker:
  grpc_address: "localhost:50051"
  graceful_shutdown_timeout: "15s"

storage:
  data_directory: "./data"
  max_record_bytes: 1048576
  max_batch_bytes: 5242880
  segment_max_bytes: 134217728
  index_interval_bytes: 4096
  flush_mode: "sync"

observability:
  log_level: "info"
  log_format: "json"

retention:
  max_age: "168h"
  max_partition_bytes: 10737418240
  check_interval: "5m"
